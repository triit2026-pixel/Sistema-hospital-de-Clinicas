<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuestas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

    <div class="mb-4">
        <a href="index.html" class="btn btn-secondary">Volver al inicio</a>
    </div>

    <div class="card">
        <div class="card-body">
            <p>¿Cómo calificarías la atención recibida?</p>
            <form>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="opinion">
                    <label class="form-check-label">Deficiente</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="opinion">
                    <label class="form-check-label">Regular</label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="radio" name="opinion" checked>
                    <label class="form-check-label">Buena</label>
                </div>
                <div class="mb-3">
                    <label class="form-label">Sugerencias</label>
                    <textarea class="form-control" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Enviar respuestas</button>
            </form>
            <p class="mt-3 text-muted"><b>Los datos son almacenados de forma segura y anónima</b></p>
        </div>
    </div>

</body>
</html>
