<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuestas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">
    <div class="container-fluid">

        <div class="mb-4">
            <a href="Pacientemenu.html" class="btn btn-secondary">Volver al inicio</a>
        </div>

        <div class="card">
            <div class="card-body">
                <p>¿Cómo calificarías la atención recibida?</p>
                <form>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="opinion">
                        <label class="form-check-label">Deficiente</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="opinion">
                        <label class="form-check-label">Regular</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="opinion" checked>
                        <label class="form-check-label">Buena</label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Sugerencias</label>
                        <textarea class="form-control" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar respuestas</button>
                </form>
                <p>¿En cual sector te atendieron?</p>
                <form>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="opinion">
                        <label class="form-check-label">Cardiología</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="opinion">
                        <label class="form-check-label">Urgencias</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="opinion" checked>
                        <label class="form-check-label">Consulta</label>
                    </div>
                     <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="opinion" checked>
                        <label class="form-check-label">Farmacia</label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Sugerencias</label>
                        <textarea class="form-control" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar respuestas</button>
                </form>
                <p class="mt-3 text-muted"><b>Los datos son almacenados de forma segura y anónima</b></p>
            </div>
        </div>

</body>
<footer class="bg-dark text-white text-center py-4 mt-auto">
    <p class="mb-0">&copy; Hospital de Clínicas</p>
    </div>
</footer>

</html>
