<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.S.M. - Encuestas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header class="bg-success text-white text-center py-3 mb-4">
        <div class="container">
            <h1 class="h3 m-0">Encuestas de Atención</h1>
        </div>
    </header>

    <main class="container flex-grow-1 px-3">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <a href="index.html" class="btn btn-outline-secondary btn-lg mb-4 w-100 fs-5 fw-bold">
                    <i class="bi bi-arrow-left me-2"></i> Volver al Inicio
                </a>

                <section class="d-grid gap-3">
                    <div class="card border-2 shadow-sm">
                        <div class="card-body p-4 text-center">
                            <h2 class="h4 text-success fw-bold">Encuesta de Atención General</h2>
                            <p class="fs-5 text-muted">Evalúe la atención recibida en el día de hoy (anónima).</p>
                            <button class="btn btn-success btn-lg w-100 fs-5">Comenzar Encuesta</button>
                        </div>
                    </div>

                    <div class="card border-2 shadow-sm">
                        <div class="card-body p-4 text-center">
                            <h2 class="h4 text-success fw-bold">Encuesta por Especialidad</h2>
                            <p class="fs-5 text-muted">Opinión sobre servicios de Policlínica o Emergencia.</p>
                            <button class="btn btn-outline-success btn-lg w-100 fs-5">Comenzar Encuesta</button>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="m-0">S.I.G.S.M. — Hospital de Clínicas</p>
    </footer>
</body>
</html>
